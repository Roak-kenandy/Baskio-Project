server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Enable once the site is served only over HTTPS (TLS terminates at the load balancer / ingress).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:5050;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:5050;
        proxy_read_timeout 600s;
        proxy_buffering off;
        include /etc/nginx/proxy_params.conf;
    }

    # `expires` instead of add_header: any add_header here would drop the security headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
